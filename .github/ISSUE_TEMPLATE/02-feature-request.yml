name: "💡 Feature Request"
description: "提交 OntiCards 新功能需求或产品改进建议"
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 OntiCards 提出改进建议。

        如果目前只是一个开放性的想法，希望先与社区讨论，可以优先前往 GitHub Discussions 的 Ideas 分类。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明这个需求出现在哪个实际使用场景中。
      placeholder: |
        例如：
        企业使用 ClickHouse 存储分析数据，希望能够像 PostgreSQL 一样直接接入 OntiCards。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 当前为什么无法满足你的需求？现有方案有什么不足？
      placeholder: "请描述当前遇到的限制或痛点。"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望实现的功能
      description: 请描述你希望 OntiCards 如何解决这个问题。
      placeholder: |
        例如：
        希望新增 ClickHouse 数据源类型，并支持元数据读取、智能数据卡片和自然语言查询。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 如果你目前有临时替代方案，可以在这里说明。
      placeholder: "没有可填写：无。"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他补充
      description: 可以添加相关截图、产品参考、接口文档或其他信息。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: "我已经搜索现有 Issues 和 Discussions，确认没有相同的功能需求。"
          required: true